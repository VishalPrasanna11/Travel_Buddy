[tool.poetry]
name = "weekly-weather-mcp"
version = "0.1.0"
description = "A weather forecast MCP server providing 8-day global weather forecasts"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"
packages = [{include = "*.py"}]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10"
fastmcp = ">=4.1.4"
requests = ">=2.32.0"
pydantic = "^2.14.1"
python-dotenv = "^1.0.0"
langchain-openai = "^1.7.3"
langchain = "^1.4.7"
openai = "^3.40.0"


[tool.poetry.group.dev.dependencies]
pytest = ">=7.0.0"
black = ">=23.0.0"
mypy = ">=1.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
