[tool.poetry]
name = "weekly-weather-mcp"
version = "0.1.0"
description = "A weather forecast MCP server providing 8-day global weather forecasts"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"
packages = [{include = "*.py"}]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10"
fastmcp = ">=4.2.0"
requests = ">=2.34.2"
pydantic = "^2.14.3"
python-dotenv = "^1.2.4"
langchain-openai = "^1.8.0"
langchain = "^1.5.0"
openai = "^3.52.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0.0"
black = ">=24.0.0"
mypy = ">=1.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
