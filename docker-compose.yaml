services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: travel-buddy-server
    depends_on:
      - postgres
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_SSL_MODE=${DB_SSL_MODE}
      - AUTH0_DOMAIN=${AUTH0_DOMAIN}
      - AUTH0_AUDIENCE=${AUTH0_AUDIENCE}
      - FRONTEND_URL=${FRONTEND_URL}
      - PORT=${PORT:-8000}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GOOGLE_PLACE_API_KEY=${GOOGLE_PLACE_API_KEY}
      - WEATHER_API_KEY=${WEATHER_API_KEY}
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY}
      - ROUTESTACK_API_KEY=${ROUTESTACK_API_KEY}
      - ROUTESTACK_API_SECRET=${ROUTESTACK_API_SECRET}
      - ROUTESTACK_BASE_URL=${ROUTESTACK_BASE_URL:-https://mcp.routestack.ai}
      - GOOGLE_CSE_ID=${GOOGLE_CSE_ID}
      - OPENWEATHER_API_URL=${OPENWEATHER_API_URL}
    volumes:
      - ./server:/app
    networks:
      - travel-buddy-network
    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: travel-buddy-client
    ports:
      - "3000:3000"
    environment:
      - VITE_AUTH0_DOMAIN=${VITE_AUTH0_DOMAIN}
      - VITE_AUTH0_CLIENT_ID=${VITE_AUTH0_CLIENT_ID}
      - VITE_AUTH0_REDIRECT_URI=${VITE_AUTH0_REDIRECT_URI}
      - VITE_AUTH0_AUDIENCE=${VITE_AUTH0_AUDIENCE}
      - VITE_BASE_URL=${VITE_BASE_URL}
      - VITE_GOOGLE_MAPS_API_KEY=${VITE_GOOGLE_MAPS_API_KEY}
    volumes:
      - ./client:/app
      - /app/node_modules
    networks:
      - travel-buddy-network
    restart: unless-stopped
  
  postgres:
    image: postgres:16-alpine
    container_name: travel-buddy-postgres
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=travelbuddy
      - POSTGRES_PASSWORD=travelbuddy
      - POSTGRES_DB=travelbuddy
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - travel-buddy-network
    restart: unless-stopped

  weather-mcp:
    build:
      context: ./weather-mcp
      dockerfile: Dockerfile
    container_name: weather-mcp-server
    ports:
      - "8080:8080"
    environment:
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY}
      - WEATHER_API_KEY=${WEATHER_API_KEY}
      - OPENWEATHER_API_URL=${OPENWEATHER_API_URL}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      - ./weather-mcp:/app
    networks:
      - travel-buddy-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  travel-buddy-network:
    driver: bridge